[project]
name = "studentflow"
version = "0.1.0"
description = "DSS5105 Track 4 local StudentFlow prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.52,<2",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "pydantic==2.13.5",
  "python-dotenv>=1,<2",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "tzdata>=2025.1",
  "google-auth>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studentflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
