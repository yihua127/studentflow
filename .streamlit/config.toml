[server]
fileWatcherType = "poll"
# The Windows setup keeps a signed Python runtime in local_data/runtime. Without this,
# Streamlit polls and reloads the whole standard library as if it were app code.
folderWatchBlacklist = ["**/local_data", "**/data", "**/downloads"]

[theme]
base = "light"
primaryColor = "#4656A6"
backgroundColor = "#FFF8DA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2B43"
font = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
headingFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "0.55rem"
buttonRadius = "0.55rem"
borderColor = "#E4E8EF"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["2rem", "1.4rem", "1.13rem"]
headingFontWeights = [650, 650, 650]
dataframeHeaderBackgroundColor = "#F5F6FA"

[theme.sidebar]
backgroundColor = "#F8F5FF"
secondaryBackgroundColor = "#FFF8DA"
textColor = "#1F2B43"
